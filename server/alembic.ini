# Alembic configuration. Run from the repo root:
#   python -m alembic -c server/alembic.ini upgrade head        (VS Code task: DB: migrate)
#   python -m alembic -c server/alembic.ini revision --autogenerate -m "describe change"
# The database URL comes from .env (DATABASE_URL) via server/app/config.py unless
# sqlalchemy.url is set here or passed with -x url=...

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
